name: "Hardware test report"
description: "Report Surface Laptop AMD touchscreen results for SL4A_TouchScreen."
title: "[Hardware test]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing SL4A_TouchScreen. Successes and failures are equally useful.
        Start with the read-only preflight and keep recovery access available.

  - type: input
    id: surface-model
    attributes:
      label: Surface model
      description: "Exact model and size, e.g. Surface Laptop 4 AMD 13.5-inch."
      placeholder: "Surface Laptop 4 AMD 13.5-inch"
    validations:
      required: true

  - type: textarea
    id: hardware-ids
    attributes:
      label: Hardware IDs
      description: "Paste the ACPI ID check."
      render: shell
      placeholder: |
        grep -E 'MSHW0230|MSHW0231|MSHW0162|AMDI0060' /sys/bus/acpi/devices/*/hid 2>/dev/null
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux distribution
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel
      description: "Output of uname -r."
    validations:
      required: true

  - type: dropdown
    id: secure-boot
    attributes:
      label: Secure Boot
      options:
        - Enabled
        - Disabled
        - Unknown
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Driver release / commit
      description: "Release tag or exact git commit tested."
    validations:
      required: true

  - type: textarea
    id: preflight
    attributes:
      label: Read-only preflight
      description: "Paste ./tools/sl4a-touch.sh install --check output."
      render: shell
    validations:
      required: true

  - type: dropdown
    id: cold-boot
    attributes:
      label: Cold boot + touch
      options:
        - PASS
        - FAIL
        - Not tested
    validations:
      required: true

  - type: dropdown
    id: suspend-resume
    attributes:
      label: Suspend/resume + touch
      options:
        - PASS
        - FAIL
        - Not tested
    validations:
      required: true

  - type: checkboxes
    id: gestures
    attributes:
      label: Input tests completed
      options:
        - label: One finger
        - label: Two fingers far apart
        - label: Close two-finger approach/separation
        - label: Pinch in/out
        - label: Crossing fingers / identity retention
        - label: Rapid lift/re-contact
        - label: Three fingers
        - label: Four fingers
        - label: Five fingers
        - label: Edge/corner contacts
        - label: Stylus
        - label: Stylus + finger coexistence

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: "Describe merging, ghost contacts, slot/ID swaps, dropouts, resets, jitter, or other anomalies."
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Driver status
      description: "Paste ./tools/sl4a-touch.sh status."
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / logs
      description: "For failures, attach relevant logs/evidence. Remove anything you do not want public."

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Beta-driver acknowledgement
      options:
        - label: I understand this is a reverse-engineered out-of-tree kernel driver and kept recovery access available.
          required: true
