name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  whitespace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check tracked whitespace
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          # captures/, docs/acpi/, docs/decomp/, tools/windows_capture/, and
          # traces/ hold verbatim forensic evidence (raw Windows/ACPI
          # captures, iasl-decompiled tables, pasted decompiler output) —
          # "fixing" their whitespace would mean editing evidence data.
          # Everything else (real source and maintained docs) is checked.
          git diff --check "$empty_tree" HEAD -- . \
            ':!captures' ':!docs/acpi' ':!docs/decomp' \
            ':!tools/windows_capture' ':!traces'

  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Run host gate
        run: |
          make -C tests test
          make -C tests clean
          make -C tests SANITIZE=1 test
          make -C tests clean

  kernel-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install generic kernel headers
        run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic
      - name: Build external modules
        run: |
          for candidate in /usr/src/linux-headers-*-generic; do
            if [ -f "$candidate/Makefile" ]; then
              KDIR="$candidate"
            fi
          done
          test -n "${KDIR:-}"
          make -C "$KDIR" M="$GITHUB_WORKSPACE/driver" clean
          make -C "$KDIR" M="$GITHUB_WORKSPACE/driver" modules
          test -s driver/sl4a-spi-amd.ko
          test -s driver/sl4a-spi-hid.ko

  # The job above builds against Ubuntu 24.04's 6.8 headers. The driver also
  # targets Arch/CachyOS/Fedora, whose kernels run ahead of LTS and where the
  # kernel APIs do change — 6.16 made the bin_attribute callback's attribute
  # const, so a stale signature is a hard -Werror build failure there, not a
  # warning. Build against current headers too: version guards belong in CI,
  # not on a user's machine.
  kernel-build-current:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install current kernel headers
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -S --noconfirm --needed base-devel git linux-headers
      - name: Build external modules
        run: |
          for candidate in /usr/lib/modules/*/build; do
            if [ -f "$candidate/Makefile" ]; then
              KDIR="$candidate"
            fi
          done
          test -n "${KDIR:-}"
          echo "building against $(basename "$(dirname "$KDIR")")"
          make -C "$KDIR" M="$GITHUB_WORKSPACE/driver" clean
          make -C "$KDIR" M="$GITHUB_WORKSPACE/driver" modules
          test -s driver/sl4a-spi-amd.ko
          test -s driver/sl4a-spi-hid.ko
